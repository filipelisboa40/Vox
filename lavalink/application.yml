server:
    port: 2333
    address: 0.0.0.0

lavalink:
    server:
        # Keep the same value in the bot's LAVALINK_PASSWORD environment variable.
        password: change-me
        sources:
            # The built-in source must be disabled when youtube-source is installed.
            youtube: false
            bandcamp: false
            soundcloud: false
            twitch: false
            vimeo: false
            nico: false
            http: false
            local: false
    plugins:
        - dependency: dev.lavalink.youtube:youtube-plugin:1.13.4
          snapshot: false

plugins:
    youtube:
        enabled: true
        allowSearch: true
        allowDirectVideoIds: true
        allowDirectPlaylistIds: true
        clients:
            - MUSIC
            - ANDROID_VR
            - WEB
            - WEBEMBEDDED
